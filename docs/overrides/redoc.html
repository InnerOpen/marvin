{% extends "main.html" %}
{% block styles %}{{ super() }}
<style>
  .md-grid { max-width: 100%; }
  .md-content__inner { margin: 0; padding: 0; }
  .md-content__inner:before { display: none; }
</style>
{% endblock %}
{% block content %}

{% endblock %}
