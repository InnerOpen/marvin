repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-yaml
        exclude: "(mkdocs.yml|marvin-chart/templates/.*\\.yaml)"
      - id: check-json
        exclude: (.vscode|.devcontainer)
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^tests/data/
  # Ruff from uv.lock, the version CI (test.yml) and `task py:lint` run, so the hook can't format differently.
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
