<!doctype html>
<!-- What the service worker shows for a page load with no network (src/pwa/sw.js). Static and self-contained:
     no session, no data, nothing personal — the only page the worker keeps. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icons/marvin.svg" type="image/svg+xml" />
    <title>Offline | Marvin</title>
    <style>
      :root {
        --bg: #fafaf9;
        --panel: #ffffff;
        --ink: #0c0a09;
        --muted: #57534e;
        --line: #e7e5e4;
        --accent: #ea580c;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0a09;
          --panel: #1c1917;
          --ink: #fafaf9;
          --muted: #a8a29e;
          --line: #292524;
          --accent: #f97316;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 420px;
        width: 100%;
        padding: 32px 28px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Marvin needs a connection to show your workspace. Check your network, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Back online: reload the page the person was trying to open.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
