# Deployment values for the `marvin` release in namespace `marvin-dev` on the iwobble OpenShift cluster:
# where changes land before production. Split topology, follows the moving `develop` images, Postgres
# on a CloudNativePG cluster rendered by this chart. Not for real users.
#
#   helm upgrade --install marvin marvin-chart -n marvin-dev -f marvin-chart/values-dev.yaml
#
# Prerequisites and the runbook: docs/manual/postgres.md — the CNPG operator (installed) and Secret
# `marvin-r2-backup` in this namespace (BACKUP_S3_BUCKET=marvin-backups-dev).

mode: split

# Dev tracks develop: every CI build of develop is picked up on the next rollout
# (`oc rollout restart deploy/marvin-backend deploy/marvin-frontend -n marvin-dev`).
image:
  repository: ghcr.io/inneropen/marvin   # backend/frontend derive as -backend / -frontend
  tag: develop
  pullPolicy: Always

# The database is Postgres, so the backend can roll: the new pod serves before the old one drains
# (split.backend.strategy left empty = the shared RollingUpdate). One replica still — uploaded assets
# live on the RWO data PVC below.
split:
  backend:
    replicaCount: 1

config:
  production: true      # OpenShift's random UID can't write /app/dev (dev mode); dev uses DATA_DIR too
  environmentLabel: DEV # badge + "[DEV] " tab titles, so dev is never mistaken for production
  logLevel: INFO
  dbEngine: postgres
  # Public tunnel hosts (Cloudflare, one level deep so the free *.iwobble.com certificate covers them):
  # admin-dev.iwobble.com → UI, api-dev.iwobble.com → API. The LAN .apps routes below keep working.
  publicApiUrl: https://api-dev.iwobble.com
  corsOrigins: "https://admin-dev.iwobble.com,https://marvin-marvin-dev.apps.ocp4.iwobble.com"

# Postgres: CloudNativePG cluster `marvin-dev-pg` (Secret `marvin-dev-pg-app` → POSTGRES_*).
postgres:
  cluster:
    enabled: true
    name: marvin-dev-pg
    # NFS is the only storage class on this cluster; see docs/manual/postgres.md ("Storage").
    storage:
      size: 10Gi
      storageClass: managed-nfs-storage

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi

# Same relaxed probe cadence as production (see values-iwobble.yaml for why).
livenessProbe:
  periodSeconds: 30
  timeoutSeconds: 15
  failureThreshold: 5
readinessProbe:
  periodSeconds: 15
  timeoutSeconds: 10

# Uploaded assets and the installation .secret (the database is in Postgres).
persistence:
  enabled: true
  storageClass: managed-nfs-storage
  size: 2Gi

# Backups: the backup engine, one CronJob per target (marvin-backup-<name>; docs/manual/offsite-backup.md).
# r2: hourly pg_dump (+ config + assets) to dev's own bucket, marvin-backups-dev (BACKUP_S3_BUCKET in the
# Secret), through the s3 target of marvin-storage-s3 (plugins.packages below). Same key layout as the
# old offsite_backup.py job, so it carries on that history. At most an hour of data lost; no point-in-time
# recovery by choice. Retention 24 hourly + 7 daily, no weekly — less than production's, since dev's data
# is disposable. Dev has no NAS target.
backup:
  # The old single-target offsite_backup.py CronJob (marvin-offsite-backup), retired by the r2 target
  # below. Its settings stay until slice 7 removes it, so `enabled: true` (with the r2 target removed or
  # suspended) is the rollback.
  enabled: false
  existingSecret: marvin-r2-backup
  retention:
    hourly: 24
    daily: 7
    weekly: 0
  schedule: "0 * * * *"
  activeDeadlineSeconds: 2700
  startingDeadlineSeconds: 900
  targets:
    - name: r2
      type: s3
      # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET (region: the
      # plugin's default, auto — right for R2).
      existingSecret: marvin-r2-backup
      schedule: "0 * * * *"
      retention: {hourly: 24, daily: 7, weekly: 0}
      # An hourly run must finish (or give up) well before the next one.
      activeDeadlineSeconds: 2700
      startingDeadlineSeconds: 900

route:
  enabled: true
  ui:
    enabled: true
    host: marvin-marvin-dev.apps.ocp4.iwobble.com
  api:
    enabled: true
    host: marvin-api-marvin-dev.apps.ocp4.iwobble.com
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  # Not for search engines, whatever hostname ends up in front of it.
  responseHeaders:
    - name: X-Robots-Tag
      value: "noindex, nofollow"

# --- Site-wide plugins — same set as production -------------------------------------------------
# One pip install into an emptyDir on PYTHONPATH, in the backend and in each backup CronJob (the r2
# target comes from marvin-storage-s3). The SDK tarball only satisfies pip; the chart removes it after
# the install, so the image's pinned SDK is the one imported.
plugins:
  packages:
    - https://github.com/InnerOpen/marvin-integration-sdk/archive/refs/heads/develop.tar.gz
    - https://github.com/InnerOpen/marvin-integration-apprise/archive/refs/heads/main.tar.gz
    - https://github.com/InnerOpen/marvin-integration-slack/archive/refs/heads/main.tar.gz
    - https://github.com/InnerOpen/marvin-integration-openai-images/archive/refs/heads/main.tar.gz
    - https://github.com/InnerOpen/marvin-integration-instagram/archive/refs/heads/main.tar.gz
    - https://github.com/InnerOpen/marvin-integration-square/archive/refs/heads/main.tar.gz
    - https://github.com/InnerOpen/marvin-integration-cloudflare-pages/archive/refs/heads/main.tar.gz
    - https://github.com/InnerOpen/marvin-integration-buttondown/archive/refs/heads/main.tar.gz
    - https://github.com/InnerOpen/marvin-integration-n8n/archive/refs/heads/main.tar.gz
    - https://github.com/InnerOpen/marvin-storage-s3/archive/refs/heads/main.tar.gz

extraEnv:
  # Dev holds a copy of production: no scheduler, so nothing fires on its own (webhook delivery,
  # scheduled tasks, queued site rebuilds, retries). The copy is also loaded with --pause-outbound.
  # Turn it on only to test something that needs it, with outbound rows still paused.
  - name: SCHEDULER_ENABLED
    value: "false"
  - name: STORAGE_LOCAL_PUBLIC_BASE_URL
    value: https://marvin-api-marvin-dev.apps.ocp4.iwobble.com/assets
  - name: INTEGRATION_HTTP_MAX_BYTES
    value: "16777216"
