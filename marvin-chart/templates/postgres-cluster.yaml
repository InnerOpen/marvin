{{- if .Values.postgres.cluster.enabled }}
{{- /*
A CloudNativePG Cluster for the app (plus, with backup.enabled, the Barman Cloud plugin's ObjectStore
and a nightly ScheduledBackup). CNPG creates the "<name>-app" Secret the backend reads its connection
from, and the "<name>-rw" Service it points at. Runbook: docs/manual/postgres.md.
*/}}
{{- $c := .Values.postgres.cluster }}
{{- $name := include "marvin.pgClusterName" . }}
{{- $bk := $c.backup }}
{{- if $bk.enabled }}
{{- $secret := $bk.existingSecret | default .Values.backup.existingSecret }}
{{- $secret = required "postgres.cluster.backup.existingSecret (or backup.existingSecret) is required when postgres.cluster.backup.enabled" $secret }}
{{- $found := (lookup "v1" "Secret" .Release.Namespace $secret).data | default dict }}
{{- $bucket := $bk.bucket | default (get $found "BACKUP_S3_BUCKET" | b64dec) }}
{{- $endpoint := $bk.endpointURL | default (get $found "BACKUP_S3_ENDPOINT" | b64dec) }}
{{- $bucket = required (printf "postgres.cluster.backup.bucket is empty and Secret %s/%s has no BACKUP_S3_BUCKET (create the Secret first)" .Release.Namespace $secret) $bucket }}
{{- $endpoint = required (printf "postgres.cluster.backup.endpointURL is empty and Secret %s/%s has no BACKUP_S3_ENDPOINT (create the Secret first)" .Release.Namespace $secret) $endpoint }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $name }}-backup
  labels:
    {{- include "marvin.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    helm.sh/resource-policy: keep
spec:
  retentionPolicy: {{ $bk.retentionPolicy | quote }}
  configuration:
    destinationPath: {{ printf "s3://%s/%s/" $bucket (trimAll "/" $bk.path) | quote }}
    endpointURL: {{ $endpoint | quote }}
    s3Credentials:
      accessKeyId:
        name: {{ $secret }}
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: {{ $secret }}
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: {{ $bk.compression }}
    data:
      compression: {{ $bk.compression }}
  instanceSidecarConfiguration:
    env:
      # boto3 >= 1.36 adds flexible checksums to every request; R2 and other S3-compatibles reject or
      # mishandle some of them. Only when required — as the off-site backup script does.
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $name }}
  labels:
    {{- include "marvin.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    # The database outlives the release: `helm uninstall` leaves the Cluster (and its PVCs) alone.
    helm.sh/resource-policy: keep
spec:
  instances: {{ int $c.instances }}
  imageName: {{ $c.imageName }}
  {{- with $c.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  storage:
    size: {{ $c.storage.size }}
    {{- with $c.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ $c.database }}
      owner: {{ $c.owner }}
  {{- with $c.parameters }}
  postgresql:
    parameters:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  {{- if $bk.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ $name }}-backup
        serverName: {{ $bk.serverName | default $name }}
  {{- end }}
{{- if $bk.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $name }}-nightly
  labels:
    {{- include "marvin.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  schedule: {{ $bk.schedule | quote }}
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ $name }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
{{- end }}
