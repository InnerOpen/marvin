{{- if .Values.backup.enabled }}
{{- if not .Values.persistence.enabled }}
{{- fail "backup.enabled needs persistence.enabled: there is no data volume to back up" }}
{{- end }}
{{- /* With dbEngine postgres the database part is a pg_dump (POSTGRES_* from the connection Secret)
       instead of the SQLite snapshot; backup.prefix puts every key under e.g. dev/. */}}
# Nightly off-site backup: a consistent SQLite snapshot, the config archive (.secret included) and
# an incremental mirror of uploaded assets to an S3-compatible bucket (Cloudflare R2 in production).
# Runs `python -m marvin.scripts.offsite_backup` from the backend image; see docs/manual/offsite-backup.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "marvin.fullname" . }}-offsite-backup
  labels:
    {{- include "marvin.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  {{- with .Values.backup.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  {{- with .Values.backup.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ int . }}
  {{- end }}
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backup
    spec:
      backoffLimit: 2
      # Bounds a stuck run (or a pod left Pending because no backend pod is running to sit beside),
      # so concurrencyPolicy: Forbid can never block the following nights.
      activeDeadlineSeconds: {{ int .Values.backup.activeDeadlineSeconds }}
      template:
        metadata:
          # Deliberately not the chart's selector labels (no app.kubernetes.io/name): the Service and
          # PodDisruptionBudget select on those, and a backup pod must never become an endpoint.
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/part-of: {{ include "marvin.name" . }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "marvin.serviceAccountName" . }}
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          # The data PVC is ReadWriteOnce and SQLite's WAL index (-shm) is shared memory: read the
          # live database from the node the backend runs on. Required, so with no backend pod the
          # job stays Pending until activeDeadlineSeconds fails it rather than mounting elsewhere.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      {{- include "marvin.selectorLabels" . | nindent 22 }}
                      {{- if eq .Values.mode "split" }}
                      app.kubernetes.io/component: backend
                      {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "marvin.plugins.initContainer" . }}
          # Storage plugins (plugins.packages): a backup target or asset provider may come from one.
          initContainers:
            {{- . | nindent 12 }}
          {{- end }}
          containers:
            - name: offsite-backup
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              {{- if eq .Values.mode "split" }}
              image: "{{ include "marvin.backendImage" . }}"
              {{- else }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              {{- end }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "marvin.scripts.offsite_backup"]
              args: ["backup"]
              env:
                - name: BACKUP_DATA_DIR
                  value: {{ .Values.config.dataDir | quote }}
                - name: DB_ENGINE
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "marvin.fullname" . }}
                      key: dbEngine
                - name: BACKUP_S3_REGION
                  value: {{ .Values.backup.s3Region | quote }}
                {{- with .Values.backup.prefix }}
                - name: BACKUP_S3_PREFIX
                  value: {{ . | quote }}
                {{- end }}
                {{- $retention := .Values.backup.retention | default dict }}
                {{- range list "hourly" "daily" "weekly" }}
                {{- if and (hasKey $retention .) (not (kindIs "invalid" (index $retention .))) }}
                - name: BACKUP_KEEP_{{ upper . }}
                  value: {{ index $retention . | quote }}
                {{- end }}
                {{- end }}
                {{- with include "marvin.postgresEnv" . | trim }}
                {{- . | nindent 16 }}
                {{- end }}
                {{- with include "marvin.plugins.env" . }}
                {{- . | nindent 16 }}
                {{- end }}
                {{- $secret := required "backup.existingSecret is required when backup.enabled" .Values.backup.existingSecret }}
                {{- range list "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "BACKUP_S3_ENDPOINT" "BACKUP_S3_BUCKET" }}
                - name: {{ . }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secret }}
                      key: {{ . }}
                {{- end }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                # Read-write, though the script only reads: a reader of a WAL-mode SQLite database
                # takes its read locks in marvin.db-shm, which a read-only mount would rule out.
                # The script opens the database itself read-only (mode=ro).
                - name: data
                  mountPath: {{ .Values.config.dataDir }}
                - name: tmp
                  mountPath: /tmp
                {{- with include "marvin.plugins.volumeMount" . }}
                {{- . | nindent 16 }}
                {{- end }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "marvin.pvcName" . }}
            # Snapshot + gzip staging (about 1.2x the database size).
            - name: tmp
              emptyDir: {}
            {{- with include "marvin.plugins.volume" . }}
            {{- . | nindent 12 }}
            {{- end }}
{{- end }}
