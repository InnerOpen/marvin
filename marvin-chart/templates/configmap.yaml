{{- /* Browser-facing API URL: an explicit config.publicApiUrl wins; otherwise, if a public API
       route is enabled with a host, derive https://<that host> so the two can't drift. */ -}}
{{- $publicApiUrl := .Values.config.publicApiUrl -}}
{{- if and (not $publicApiUrl) .Values.route.enabled .Values.route.api.enabled .Values.route.api.host -}}
{{- $publicApiUrl = printf "https://%s" .Values.route.api.host -}}
{{- end -}}
{{- /* Browser origins allowed to call the API in production (split UI/API deployments,
       where the browser calls the API cross-origin). An explicit config.corsOrigins wins;
       otherwise, if the UI route has an explicit host, derive https://<that host>. Empty
       for same-origin/combined deploys, which need no CORS. */ -}}
{{- $corsOrigins := .Values.config.corsOrigins -}}
{{- if and (not $corsOrigins) .Values.route.enabled .Values.route.ui.enabled .Values.route.ui.host -}}
{{- $corsOrigins = printf "https://%s" .Values.route.ui.host -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "marvin.fullname" . }}
  labels:
    {{- include "marvin.labels" . | nindent 4 }}
data:
  production: {{ .Values.config.production | quote }}
  allowSignup: {{ .Values.config.allowSignup | quote }}
  logLevel: {{ .Values.config.logLevel | quote }}
  dbEngine: {{ .Values.config.dbEngine | quote }}
  dataDir: {{ .Values.config.dataDir | quote }}
  apiPort: {{ .Values.config.apiPort | quote }}
  apiHost: {{ .Values.config.apiHost | quote }}
  publicApiUrl: {{ $publicApiUrl | default "" | quote }}
  corsOrigins: {{ $corsOrigins | default "" | quote }}
  frontendPort: {{ .Values.config.frontendPort | quote }}
  schedulerInterval: {{ .Values.config.schedulerInterval | quote }}
  webhookRetryAttempts: {{ .Values.config.webhookRetryAttempts | quote }}
  webhookRetryDelay: {{ .Values.config.webhookRetryDelay | quote }}
  webhookTimeout: {{ .Values.config.webhookTimeout | quote }}
