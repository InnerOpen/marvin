# Default values for marvin (Development environment)
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Deployment topology:
#   combined — one container runs the API and the server-rendered frontend together (default).
#   split    — two Deployments: the backend API and the frontend UI, scaled and rolled
#              independently. Uses the marvin-backend / marvin-frontend images.
mode: combined

# Image configuration
image:
  # Combined mode uses this image. Split mode derives the backend/frontend images from the same
  # repository + tag by appending -backend / -frontend (override under `split` if they differ).
  repository: marvin
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# Split-mode configuration (ignored when mode=combined). The backend and frontend images default
# to <image.repository>-backend / -frontend at <image.tag>; override here for a different registry.
split:
  backend:
    replicaCount: 1
    image:
      repository: ""   # defaults to "<image.repository>-backend"
      tag: ""          # defaults to image.tag
  frontend:
    replicaCount: 1
    image:
      repository: ""   # defaults to "<image.repository>-frontend"
      tag: ""          # defaults to image.tag

# imagePullSecrets for private registries
imagePullSecrets: []

# Override the chart name
nameOverride: ""
fullnameOverride: ""

# Deployment configuration
replicaCount: 1

# Update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Service Account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext: {}
  # fsGroup: 2000

# Container security context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Resource limits and requests
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Liveness and readiness probes
livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Service configuration
service:
  type: ClusterIP
  port: 8080
  # The frontend is a second port on the same pod, exposed alongside the API
  frontendPort: 4322
  # Both ports resolve to the container's named ports, so they track config.apiPort /
  # config.frontendPort automatically and can't drift out of sync with them.
  #
  # NodePort pinning — only used when type: NodePort. Empty = let Kubernetes assign
  # one from the 30000-32767 range. Pin them when you need a stable URL up front:
  # e.g. so config.publicApiUrl can name the API port BEFORE the first install
  # (one-shot deploy, no second pass), and so the ports don't change on reinstall.
  #   http     = the API port (combined Service, or the -backend Service in split)
  #   frontend = the UI  port (combined Service, or the -frontend Service in split)
  nodePorts:
    http: ""
    frontend: ""
  annotations: {}

# OpenShift Routes.
#
# Two independent routes — a public web UI and an (optional) public API — that resolve to the right
# Service in BOTH topologies, so the routing is identical whether you run combined or split:
#   combined: ui → the one Service's `frontend` port,  api → its `http` port
#   split:    ui → the -frontend Service,               api → the -backend Service
#
# By default only the UI is exposed. The frontend reaches the API *internally* over the cluster
# Service (SSR uses MARVIN_API_URL → the -backend Service in split mode, or localhost in combined),
# so no public API route is needed to render pages. Expose the API publicly only when the browser
# must call it directly (client-side/interactive features) or for external SDK/CLI access.
route:
  enabled: true

  # TLS + annotations apply to both routes below unless overridden per-route.
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  annotations: {}

  # Public web UI route — the site users visit.
  ui:
    enabled: true
    host: ""   # auto-assigned by OpenShift if empty
    path: /

  # Public API route — OFF by default (API is reached internally; see the note above). Enable for
  # direct browser/SDK/CLI access, then point config.publicApiUrl at it — or just set api.host and
  # publicApiUrl is auto-derived from it (see configmap.yaml).
  api:
    enabled: false
    host: ""
    path: /

# Persistent storage
persistence:
  enabled: true
  # existingClaim: ""
  storageClass: ""  # Use cluster default
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations: {}

# Application configuration
config:
  # Environment mode
  production: false

  # Application settings
  allowSignup: true
  logLevel: DEBUG

  # Database configuration
  dbEngine: sqlite
  dataDir: /app/data

  # API configuration
  apiPort: 8080
  apiHost: "0.0.0.0"

  # URL the user's browser uses to reach the backend API. The frontend injects it into each page
  # at request time (resolved at runtime, not baked into the image), so set it to the address a
  # browser can actually reach — e.g. https://marvin.example.com. Left empty, the browser falls
  # back to http://localhost:8080, which only works for local single-host access.
  publicApiUrl: ""

  # Comma-separated browser origins allowed to call the API in PRODUCTION — required for
  # SPLIT deployments where the UI and API are on different hosts and the browser calls the
  # API cross-origin (e.g. "https://marvin.example.com"). If left empty and a UI route with
  # an explicit host is enabled, it's derived as https://<ui route host>. Leave empty for
  # same-origin/combined deployments (no CORS middleware is added). Maps to the API's
  # CORS_ORIGINS env var.
  corsOrigins: ""

  # Server-rendered frontend (Astro SSR) — the image runs it alongside the API.
  # Pinned rather than derived from FRONTEND_URL: the containerPort has to be a fixed number for
  # the Service to target it. Keep in step with the FRONTEND_URL the deployment advertises.
  frontendPort: 4322

  # Scheduler configuration
  # Scheduler frequent-tick interval in seconds — delivers webhooks, fires due scheduled tasks, and
  # renews the leadership lease (wired to SCHEDULER_INTERVAL_SECONDS). If you raise this, the app
  # also requires the lease TTL to be at least twice it (default TTL is 150s), or it refuses to
  # start — set SCHEDULER_LEASE_TTL_SECONDS via extraEnv accordingly.
  schedulerInterval: 60

  # Webhook configuration
  webhookRetryAttempts: 3
  webhookRetryDelay: 2
  webhookTimeout: 30

# Application secrets
# In production, use sealed-secrets or external secret management
secrets:
  # SMTP Configuration
  smtpHost: "localhost"
  smtpPort: "1025"
  smtpUser: ""
  smtpPassword: ""
  smtpFromEmail: "noreply@marvin.local"

  # Security
  # Deliberately empty: a default here is a published signing key, and `secrets: {}` in an
  # overlay would not clear it (Helm coalesces maps, so unset keys keep the parent's value).
  # Left empty, the chart reuses the key already in the cluster or generates a random one.
  jwtSecret: ""
  apiKey: ""

  # External services (if any)
  # Add your secrets here

# Pod disruption budget (only meaningful with replicaCount > 1)
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1  # mutually exclusive with minAvailable

# Extra environment variables
extraEnv: []
  # - name: DEBUG
  #   value: "true"

# Init containers, run to completion before the app container starts.
#
# The main use is installing integration plugins without rebuilding the image. Marvin discovers
# providers through the `marvin.integrations` entry-point group, which is read from installed
# distribution metadata at process start — so a plugin has to be a real installed distribution on
# sys.path before the app imports, and adding one always means a pod restart. Pair this with
# extraVolumes/extraVolumeMounts/extraEnv, as in the worked example in README.md:
#
# initContainers:
#   - name: install-plugins
#     image: python:3.12-slim
#     command: ["sh", "-c", "pip install --target /plugins marvin-integration-slack"]
#     volumeMounts:
#       - name: plugins
#         mountPath: /plugins
#
# Note that PYTHONPATH precedes site-packages, so a dependency vendored here shadows the image's
# copy. Pin deliberately, or build a derived image instead — see README.md.
initContainers: []

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []
