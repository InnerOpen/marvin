name: Documentation

on:
  push:
    branches: [develop]
    paths:
      - "docs/manual/**"
      - "docs/overrides/**"
      - "mkdocs.yml"
      - "src/marvin/**"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE: ${{ github.workspace }}/site
  DOCS_BASE_URL: https://inneropen.github.io/marvin

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marvin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: marvin

      - name: Checkout marvin-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: InnerOpen/marvin-sdk
          ref: develop
          path: marvin-sdk

      - name: Checkout marvin-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: InnerOpen/marvin-cli
          ref: develop
          path: marvin-cli

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: marvin/uv.lock

      # The default `dev` group carries mkdocs + mkdocs-material. LDAP is imported lazily and
      # DB_ENGINE defaults to sqlite, so nothing else is needed to import the app.
      - name: Install dependencies
        working-directory: marvin
        run: uv sync

      - name: Export OpenAPI spec
        working-directory: marvin
        env:
          DB_ENGINE: sqlite
        run: uv run python -c "import json; from marvin.app import app; json.dump(app.openapi(), open('docs/manual/openapi.json', 'w'), indent=2)"

      - name: Build core site
        working-directory: marvin
        run: uv run mkdocs build --strict --site-dir "$SITE"

      # The SDK and CLI keep their own mkdocs.yml; only site_url is swapped so canonical URLs
      # and sitemaps point at their mount inside this site.
      - name: Build SDK site
        working-directory: marvin-sdk
        run: |
          sed "s#^site_url:.*#site_url: $DOCS_BASE_URL/sdk/#" mkdocs.yml > mkdocs.pages.yml
          ../marvin/.venv/bin/mkdocs build --strict -f mkdocs.pages.yml --site-dir "$SITE/sdk"

      - name: Build CLI site
        working-directory: marvin-cli
        run: |
          sed "s#^site_url:.*#site_url: $DOCS_BASE_URL/cli/#" mkdocs.yml > mkdocs.pages.yml
          ../marvin/.venv/bin/mkdocs build --strict -f mkdocs.pages.yml --site-dir "$SITE/cli"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.SITE }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
