name: Helm Validation

# Validate Helm chart quality and deployability
# Tests lint, template rendering, and deployment to Kind cluster

on:
  pull_request:
    paths:
      - 'marvin-chart/**'
      - '.github/workflows/helm.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'marvin-chart/**'
      - '.github/workflows/helm.yml'   # a change to this file tests itself (2026-10-13: a Kind fix shipped unrun)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Helm Lint & Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.14.0'

      - name: Lint Helm chart
        run: |
          helm lint marvin-chart/ --strict

      - name: Template Helm chart (default values)
        run: |
          helm template marvin marvin-chart/ \
            --debug \
            --output-dir /tmp/marvin-templates

      # `--api-versions route.openshift.io/v1` makes the OpenShift Route render: the template is
      # capability-gated so it silently vanishes from a plain `helm template`, leaving it untested.
      - name: Template Helm chart (production values)
        run: |
          helm template marvin marvin-chart/ \
            --values marvin-chart/values-production.yaml \
            --set image.tag=latest \
            --api-versions route.openshift.io/v1 \
            --debug \
            --output-dir /tmp/marvin-templates-prod

      # The Postgres path: POSTGRES_* wiring, the CNPG Cluster, the hourly pg_dump CronJob.
      - name: Template Helm chart (dev values, Postgres)
        run: |
          helm template marvin marvin-chart/ \
            --namespace marvin-dev \
            --values marvin-chart/values-dev.yaml \
            --api-versions route.openshift.io/v1 \
            --debug \
            --output-dir /tmp/marvin-templates-dev

      - name: Template Helm chart (iwobble values, Postgres)
        run: |
          helm template marvin marvin-chart/ \
            --values marvin-chart/values-iwobble.yaml \
            --api-versions route.openshift.io/v1 \
            --debug \
            --output-dir /tmp/marvin-templates-iwobble

      # The chart's default is SQLite (a plain install needs no operator); every environment's values file
      # pins Postgres and a CloudNativePG Cluster. A values file that loses its pin would deploy that environment
      # onto an empty SQLite file, so each one is rendered and checked: engine in the ConfigMap, and the Cluster.
      - name: Assert the database engine each values file renders
        run: |
          set -euo pipefail
          render() { helm template marvin marvin-chart/ --api-versions route.openshift.io/v1 "$@"; }

          render > /tmp/engine-default.yaml
          grep -q 'dbEngine: "sqlite"' /tmp/engine-default.yaml
          if grep -q 'apiVersion: postgresql.cnpg.io' /tmp/engine-default.yaml; then
            echo "default values must not render a CloudNativePG Cluster"; exit 1
          fi
          echo "default: sqlite, no Cluster"

          for env in iwobble dev production k8s; do
            render --values "marvin-chart/values-$env.yaml" --set image.tag=latest > "/tmp/engine-$env.yaml"
            grep -q 'dbEngine: "postgres"' "/tmp/engine-$env.yaml" \
              || { echo "values-$env.yaml does not render dbEngine: \"postgres\""; exit 1; }
            grep -q 'apiVersion: postgresql.cnpg.io' "/tmp/engine-$env.yaml" \
              || { echo "values-$env.yaml does not render a CloudNativePG Cluster"; exit 1; }
            echo "$env: postgres + CloudNativePG Cluster"
          done

      - name: Upload rendered templates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-templates
          path: /tmp/marvin-templates*

  # A default install runs on SQLite (no operator); the Postgres variant installs the CloudNativePG operator and
  # asks for the cluster, as the environment values files do.
  integration-test:
    name: Helm Integration Test (Kind, ${{ matrix.engine }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgres]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.14.0'

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: marvin-test
          wait: 120s

      # The Cluster the chart renders for Postgres needs the operator in the cluster first — as on a real one
      # (docs/manual/postgres.md).
      - name: Install CloudNativePG operator
        if: matrix.engine == 'postgres'
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm install cnpg cnpg/cloudnative-pg \
            --namespace cnpg-system --create-namespace \
            --wait --timeout 5m

      # Build the same `production` target that docker.yml and the Taskfile build.
      - name: Build Docker image for testing
        run: |
          docker build -t marvin:test -f docker/Dockerfile --target production .

      - name: Load image into Kind
        run: |
          kind load docker-image marvin:test --name marvin-test

      - name: Create test namespace
        run: |
          kubectl create namespace marvin-test

      - name: Install Helm chart
        run: |
          engine_args=()
          if [[ "${{ matrix.engine }}" == "postgres" ]]; then
            engine_args=(--set config.dbEngine=postgres --set postgres.cluster.enabled=true)
          fi
          helm install marvin marvin-chart/ \
            --namespace marvin-test \
            --set image.repository=marvin \
            --set image.tag=test \
            --set image.pullPolicy=Never \
            "${engine_args[@]}" \
            --debug

      # The app pods can't start until CNPG has bootstrapped the database and written the "<cluster>-app"
      # Secret they read their connection from, so wait for the Cluster first, then for the pods.
      - name: Wait for the database cluster
        if: matrix.engine == 'postgres'
        run: |
          kubectl wait --for=condition=Ready cluster/marvin-pg \
            --namespace marvin-test \
            --timeout=300s

      # `kubectl wait` fails at once ("no matching resources found") if no pod exists yet, which raced the
      # SQLite install (no database to wait on first), so wait for the pods to appear before waiting on them.
      - name: Wait for pods to be ready
        run: |
          for _ in $(seq 1 60); do
            kubectl get pods -n marvin-test -l app.kubernetes.io/name=marvin -o name | grep -q . && break
            sleep 5
          done
          kubectl wait --for=condition=ready pod \
            --selector=app.kubernetes.io/name=marvin \
            --namespace marvin-test \
            --timeout=300s

      - name: Check pod status
        run: |
          kubectl get pods -n marvin-test
          kubectl get services -n marvin-test

      # The service publishes 8080 (API) and 4322 (frontend) — there has never been a port 80, so
      # the old `8080:80` forward could not connect and the `|| echo` swallowed the failure.
      - name: Test health and frontend endpoints
        run: |
          set -euo pipefail

          kubectl port-forward -n marvin-test svc/marvin 8080:8080 4322:4322 &
          trap 'kill %1 2>/dev/null || true' EXIT
          sleep 5

          echo "--- liveness ---"
          curl -fsS http://localhost:8080/healthz
          echo "--- readiness ---"
          curl -fsS http://localhost:8080/readyz
          echo "--- frontend (login renders without auth) ---"
          curl -fsS -o /dev/null http://localhost:4322/login
          echo "✅ API and frontend both serving"

      - name: Check logs on failure
        if: failure()
        run: |
          echo "=== Pod Logs ==="
          kubectl logs -n marvin-test --selector=app.kubernetes.io/name=marvin --tail=100

          echo "=== Pod Events ==="
          kubectl get events -n marvin-test --sort-by='.lastTimestamp'

          echo "=== Pod Describe ==="
          kubectl describe pods -n marvin-test

      - name: Helm test (if tests defined)
        run: |
          helm test marvin --namespace marvin-test || echo "No Helm tests defined"
        continue-on-error: true

      - name: Uninstall Helm chart
        if: always()
        run: |
          helm uninstall marvin --namespace marvin-test || true

      - name: Delete test namespace
        if: always()
        run: |
          kubectl delete namespace marvin-test || true

  security-scan:
    name: Helm Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The scan is informational (soft fail). Run the image directly rather than through checkov-action:
      # the action's entrypoint copies the whole report into $GITHUB_ENV, and with the code blocks it
      # prints for every failed check that grew past the kernel's per-variable limit, so the job's
      # cleanup steps died with "Argument list too long". --compact drops the code blocks, --quiet the
      # passed checks; the failures themselves are unchanged.
      - name: Run Checkov scan on Helm templates
        run: |
          docker run --rm -v "$PWD/marvin-chart:/chart:ro" bridgecrew/checkov:2.0.930 \
            -d /chart --framework helm --output cli --soft-fail --compact --quiet
        continue-on-error: true

  package:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    needs:
      - lint
      - integration-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.14.0'

      - name: Package Helm chart
        run: |
          mkdir -p .helm-packages
          helm package marvin-chart/ --destination .helm-packages/

      - name: Upload Helm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-chart-package
          path: .helm-packages/*.tgz
